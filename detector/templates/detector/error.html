{% extends 'base.html' %}
{% block header_title %}Error{% endblock %}
{% block header_subtitle %}Algo salió mal{% endblock %}

{% block content %}
<div style="text-align: center; padding: 40px 20px;">
    <i class="fa-solid fa-triangle-exclamation" style="font-size: 60px; color: #ef4444; margin-bottom: 20px;"></i>
    <h2 style="color: #1e293b; margin-bottom: 10px;">¡Ups!</h2>
    <p style="color: #64748b; font-size: 15px;">{{ mensaje }}</p>
    <a href="{% url 'home' %}" class="btn-primario" style="display: inline-block; margin-top: 20px; padding: 12px 25px; border-radius: 10px; text-decoration: none;">
        Volver al inicio
    </a>
</div>
{% endblock %}
